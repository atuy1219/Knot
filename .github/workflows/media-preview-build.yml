name: Diagnose SDK 37
on:
  push:
    branches: [build/media-preview-e242096]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect official SDK repository
        run: |
          curl -fsSL https://dl.google.com/android/repository/repository2-3.xml -o /tmp/sdk-repository.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/sdk-repository.xml').getroot()
          for p in root.findall('remotePackage'):
              path = p.get('path', '')
              if path.startswith(('platforms;', 'cmdline-tools;')):
                  print(path, ET.tostring(p, encoding='unicode')[:600])
          PY
      - name: Update SDK command-line tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;latest'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=3
      - name: Install SDK 37
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37"'
