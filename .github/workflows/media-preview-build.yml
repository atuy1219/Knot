name: Build PR source with SDK 37
on:
  push:
    branches: [build/media-preview-e242096]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f0313c83530c1fe93abd9529ba5340898c0ec9d9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Install SDK 37.0
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Verify source commit
        run: |
          test "$(git rev-parse HEAD)" = "f0313c83530c1fe93abd9529ba5340898c0ec9d9"
          git diff --exit-code HEAD
          git rev-parse HEAD > build-provenance.txt
          echo 'Android SDK 37.0; no source substitutions' >> build-provenance.txt
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and unchanged sources
        run: |
          git diff --exit-code HEAD
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk >> build-provenance.txt
          cat build-provenance.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Knot-media-preview-f0313c8-sdk37-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build-provenance.txt
          if-no-files-found: error
