name: Debug APK Build

on:
  pull_request:
    branches:
      - agent/debug-apk-base

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK to PR head
        run: |
          mkdir -p debug-apk
          cp app/build/outputs/apk/debug/app-debug.apk debug-apk/Knot-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-apk/Knot-debug.apk
          git commit -m "Publish debug APK" || exit 0
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Knot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
