name: Debug build

on:
  push:
    branches:
      - debug/image-notification-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_LIST="$(sdkmanager --list --channel=3)"
          PLATFORM="$(printf '%s\n' "$SDK_LIST" | awk '$1 == "platforms;android-37" || $1 ~ /^platforms;android-CinnamonBun/ { print $1; exit }')"
          if [ -z "$PLATFORM" ]; then
            echo "Android 17 platform package was not found. Available platform packages:" >&2
            printf '%s\n' "$SDK_LIST" | awk '$1 ~ /^platforms;/ { print $1 }' >&2
            exit 1
          fi
          echo "Using SDK package: $PLATFORM"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platform-tools" "$PLATFORM"

          PLATFORM_DIR="${PLATFORM#platforms;}"
          if [ "$PLATFORM_DIR" != "android-37" ] && [ -d "$ANDROID_SDK_ROOT/platforms/$PLATFORM_DIR" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/$PLATFORM_DIR" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Knot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
