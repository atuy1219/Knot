name: Feature media refactor validation

on:
  push:
    branches:
      - debug/image-notification-preview

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/image-notification-preview
          fetch-depth: 0

      - name: Apply refactor
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/refactor_feature.py
          python3 /tmp/refactor_feature.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platform-tools" "platforms;android-37.0"

      - name: Format
        run: gradle --no-daemon :app:spotlessApply

      - name: Validate removed legacy paths
        shell: bash
        run: |
          ! grep -R --line-number 'packageId == 5L\|isEmojiLike()\|sticonshop/v1/sticon.*iPhone' app/src/main/java/app/zipper/knot/hooks
          git diff --check

      - name: Build
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit feature change
        shell: bash
        run: |
          git config user.name "Atuy"
          git config user.email "130917473+atuy1219@users.noreply.github.com"
          git add app/src/main/java/app/zipper/knot/LineVersion.java app/src/main/java/app/zipper/knot/versions/Version26130.java app/src/main/java/app/zipper/knot/versions/Version26131.java app/src/main/java/app/zipper/knot/hooks/LineCombinationStickerMediaResolver.java app/src/main/java/app/zipper/knot/hooks/LineStickerGlideMediaResolver.java app/src/main/java/app/zipper/knot/hooks/LineSticonMediaResolver.java app/src/main/java/app/zipper/knot/hooks/NotificationMediaPreviewHook.java
          git diff --cached --check
          git commit -m "通知メディアのLINE内部経路とバージョン依存を整理"
          git push origin HEAD:feature/image-notification-preview
